name: "Человек-паук: Новый день"
description: "Том Холланд возвращается в роли Питера Паркера в новом захватывающем приключении, которое переосмысливает историю супергероя после событий предыдущих фильмов. Питер сталкивается с новыми вызовами и врагами, пытаясь найти баланс между жизнью обычного человека и миссией Человека-паука."
