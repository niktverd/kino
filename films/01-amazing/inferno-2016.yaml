name: "Инферно (2016)"
description: "Экранизация романа Дэна Брауна. Профессор Роберт Лэнгдон просыпается в больнице Флоренции без памяти о последних днях. Его преследуют неизвестные враги, а в руках у него оказывается загадочный артефакт. Вместе с молодой врачом он должен разгадать древние тайны и остановить глобальную угрозу, путешествуя по историческим памятникам Европы."
