name: "Микки 17"
description: "Научно-фантастический триллер от режиссёра Пон Джун-хо о Микки Барнсе, одноразовом работнике на колонизации ледяного мира. Когда Микки погибает, его воспоминания загружаются в новое тело. Но после очередной миссии возвращается не только новый клон под номером 18, но и предыдущий Микки 17, что создаёт экзистенциальный кризис и опасную ситуацию."
