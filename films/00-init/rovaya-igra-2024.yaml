name: "Ролевая игра"
description: "Супруги решают освежить брак ролевой игрой в отеле Нью-Йорка. Но когда муж раскрывает тайную жизнь жены, выясняется, что она — наёмный убийца международного уровня. Теперь за их семьёй начинается настоящая охота, а мужу придётся принять неожиданную сторону в мире шпионажа и контрактов на убийство."
