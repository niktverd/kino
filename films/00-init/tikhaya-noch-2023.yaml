name: "Тихая ночь"
description: "Уникальный боевик от Джона Ву без единого слова диалога. Отец теряет сына в перестрелке бандитов в канун Рождества. Раненый в горло, он теряет голос. После выздоровления он начинает планомерно и жестоко уничтожать банду, убившую его ребёнка. Весь фильм — визуальный экшен, где всё держится на мимике, действии и звуке."
