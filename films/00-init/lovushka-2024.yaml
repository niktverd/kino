name: "Ловушка"
description: "Новый триллер М. Найта Шьямалана. Отец приходит с дочерью на поп-концерт, но вдруг замечает, что всё здание оцеплено полицией. Выясняется, что это спецоперация по поимке серийного убийцы по прозвищу «Мясник». И Twist в том, что отец и есть этот убийца, и ему нужно найти способ выбраться, не выдав себя."
