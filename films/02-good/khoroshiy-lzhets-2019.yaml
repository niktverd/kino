name: "Хороший лжец (2019)"
description: "Опытный британский аферист (Иэн Маккеллен) находит в интернете идеальную жертву — богатую, одинокую вдову (Хелен Миррен). Он проникает в ее дом и готовится изящно лишить ее всех сбережений. Но он не подозревает, что это знакомство не было случайным, и ловушка на самом деле захлопнулась для него."
opinion: "Это настоящий мастер-класс по элегантной, многолетней мести, где до самого финала вы не понимаете истинного масштаба плана. Вайб Монте-Кристо: Идеальная шахматная партия. Здесь нет перестрелок, только безупречные манеры, дорогие рестораны Лондона, обманки внутри обманок и сокрушительный финальный удар. Картинка: Очень уютная, классическая английская эстетика, красивые загородные дома и британский стиль."
reason: "Излишне жестокий"
